<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Guardian — Punch Trainer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/toastify.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body x-data="boxing()" x-init="init()">
  <div class="arena">
    <div class="stage">
      <img id="videoFeed" src="{{ url_for('video_feed') }}" alt="Arena"
           @error="videoError = true" @load="videoError = false">

      <!-- Kamera belum siap -->
      <div class="video-empty" x-show="videoError" x-cloak>
        <span class="spinner"></span><p>Menyiapkan kamera…</p>
      </div>

      <!-- Petunjuk saat idle (belum Play) -->
      <div class="coach" x-show="!videoError && status === 'idle'" x-cloak>
        <div class="coach-card">
          <p class="coach-1">Siap bertanding?</p>
          <p class="coach-2">Tekan <b>▶ Play</b> untuk mulai</p>
        </div>
      </div>

      <!-- Alert backend: tubuh tidak terdeteksi, dll. -->
      <div class="alert-bar" x-show="alerts.length > 0 && status === 'playing'" x-cloak>
        <span x-text="alerts[0]"></span>
      </div>

      <!-- HUD: skor / kombo / waktu -->
      <div class="hud" x-cloak>
        <div class="hud-item"><span class="hud-num" x-text="stats.score"></span><span class="hud-lbl">Skor</span></div>
        <div class="hud-item hud-combo" :class="{ 'on': stats.combo > 1 }">
          <span class="hud-num" x-text="'x' + stats.combo"></span><span class="hud-lbl">Kombo</span>
        </div>
        <div class="hud-item"><span class="hud-num" x-text="elapsedText"></span><span class="hud-lbl">Waktu</span></div>
      </div>

      <!-- Badge status -->
      <div class="status-badge" :class="statusClass" x-cloak>
        <span class="status-pulse"></span><span x-text="statusText"></span>
      </div>

      <!-- Metrik kecepatan & ekstensi (tampil saat playing) -->
      <div class="metrics-bar" x-show="status === 'playing'" x-cloak>
        <span class="metric-item">
          L <b x-text="metrics.left.speed !== null ? metrics.left.speed + ' m/s' : '–'"></b>
        </span>
        <span class="metric-sep">|</span>
        <span class="metric-item">
          R <b x-text="metrics.right.speed !== null ? metrics.right.speed + ' m/s' : '–'"></b>
        </span>
        <span class="metric-sep">|</span>
        <span class="metric-item">
          Akurasi <b x-text="stats.accuracy + '%'"></b>
        </span>
      </div>

      <!-- Target -->
      <div class="target" x-show="target" :style="targetStyle" x-cloak>
        <span class="target-ring"></span>
        <span class="target-core">🥊</span>
      </div>
    </div>

    <!-- Pemilih level kesulitan -->
    <div class="levels" x-cloak>
      <template x-for="lv in levels" :key="lv">
        <button class="level-btn" :class="{ 'on': difficulty === lv }"
                @click="setDifficulty(lv)" :disabled="busy"
                x-text="levelLabel[lv] || lv"></button>
      </template>
    </div>

    <!-- Tombol Play & Stop -->
    <div class="controls">
      <button class="btn btn--primary" @click="play()" :disabled="busy">
        <span x-show="!busy">▶ Play</span>
        <span x-show="busy" x-cloak>Menyiapkan…</span>
      </button>
      <button class="btn btn--ghost" @click="stop()" :disabled="busy">⏹ Stop</button>
    </div>
  </div>

  <script defer src="{{ url_for('static', filename='vendor/dayjs.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/toastify.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/alpine.min.js') }}"></script>
</body>
</html>
